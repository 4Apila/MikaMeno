<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Mikä Meno?</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	</head>

	<body>
		<h1>Mikä Meno?</h1>
        <h2>Selaa tapahtumia täällä</h2>
        <table>
		    <tr th:each="tapahtuma: ${tapahtumat}">
                <td th:text="${tapahtuma.nimi}">Tapahtuman nimi</td>
                <td th:text="${tapahtuma.alkupv}">Tapahtuman alkupäivä ja -aika</td>
                <td th:text="${tapahtuma.loppupv}">Tapahtuman loppumispäivä ja -aika</td>
                <td th:text="${tapahtuma.kuvaus}">Tapahtuman kuvaus</td>
                <td th:text="${tapahtuma.paikka}">Tapahtumapaikka</td>
                <td th:text="${tapahtuma.maxOsallistujat}">Tapahtuman enimmäiskoko</td>
                <td th:text="${tapahtuma.jarjestaja}">Tapahtuman järjestäjä</td>
            </tr>
        </table>
		</div>
	</body>
</html>
