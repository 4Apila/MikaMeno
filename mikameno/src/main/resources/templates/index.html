<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Mikä Meno?</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
	<h1>Mikä Meno?</h1>
	<p>Esittelyteksti</p>
	<p>Kirjaudu sisään -linkki</p>
	<p>Katso tapahtumia -linkki, joka vie /tapahtuma/{id}</p>
	<a href="lisaaTapahtuma">Lisää tapahtuma</a>

	<div>
		<h3>Tapahtumalistaus</h3>
		 <table>
			<tr th:each="tapahtuma: ${tapahtumat}">
				<td th:text="${tapahtuma.nimi}">Tapahtuman nimi</td>
				<td th:text="${#temporals.format(tapahtuma.alkupv, 'dd.MM.yyyy HH:mm')}">Tapahtuman alkupäivä ja -aika</td>
				<td th:text="${tapahtuma.kuvaus}">Tapahtuman kuvaus</td>
				<td th:text="${tapahtuma.paikka}">Tapahtumapaikka</td>
				<td><a th:href="@{/tapahtuma/{id}(id=${tapahtuma.id})}">Avaa</a></td>
			</tr>
		</table>
	</div>
</body>

</html>
